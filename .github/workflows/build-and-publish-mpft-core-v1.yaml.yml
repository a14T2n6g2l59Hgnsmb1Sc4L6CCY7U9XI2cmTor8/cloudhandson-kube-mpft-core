name: build-and-publish-mpft-core-v1.yaml
on:
  push:
    branches: [ "feature/github_action_test" ]
  pull_request:
    branches: [ "feature/github_action_test" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build with Maven
        run: |
          ls -lrth ~/.m2/